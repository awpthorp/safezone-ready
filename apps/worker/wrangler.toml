name = "safezone-ready-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "local"
GEMINI_MODEL_PRIMARY = "gemini-3.1-flash-image"
GEMINI_MODEL_ESCALATION = "gemini-3-pro-image"
GEMINI_API_BASE = "https://generativelanguage.googleapis.com/v1beta/interactions"
FIXES_ENABLED = "true"

# Secrets:
# GEMINI_API_KEY

[[d1_databases]]
binding = "DB"
database_name = "safezone-ready"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../infra/migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "szr-assets"

[[queues.consumers]]
queue = "szr-fix-jobs"
max_batch_size = 1
max_retries = 2

[env.staging]
name = "safezone-ready-worker-staging"

[env.production]
name = "safezone-ready-worker-production"

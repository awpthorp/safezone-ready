<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Safe Zone Ready overlay on a 9:16 ad still">
  <rect width="1200" height="630" fill="#1c1914"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#vignette)"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2a241c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1c1914" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="12" height="12" fill="#7a1f16" fill-opacity="0.55"/>
      <rect width="6" height="12" fill="#ef4444" fill-opacity="0.42"/>
    </pattern>
    <linearGradient id="still" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3228"/>
      <stop offset="55%" stop-color="#2c261e"/>
      <stop offset="100%" stop-color="#1a1612"/>
    </linearGradient>
  </defs>

  <g transform="translate(96,55)">
    <rect x="0" y="0" width="292" height="520" rx="18" fill="#14110e" stroke="#3d3428" stroke-width="2"/>
    <rect x="10" y="10" width="272" height="500" rx="10" fill="url(#still)"/>
    <text x="146" y="86" text-anchor="middle" fill="#f4efe4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">NIGHT SHIFT</text>
    <text x="146" y="112" text-anchor="middle" fill="#b8a990" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">9:16 still</text>
    <rect x="28" y="28" width="236" height="464" fill="none" stroke="#e8c04a" stroke-width="3" stroke-dasharray="10 8" rx="6"/>
    <text x="146" y="412" text-anchor="middle" fill="#e8c04a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700">50% OFF</text>
    <text x="146" y="450" text-anchor="middle" fill="#f4efe4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">FREE DELIVERY</text>
    <rect x="10" y="368" width="272" height="142" fill="url(#hatch)"/>
    <text x="146" y="488" text-anchor="middle" fill="#f8d0c8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Caption band covers the offer</text>
  </g>

  <g transform="translate(460,190)">
    <g>
      <rect width="36" height="36" rx="8" fill="#e8c04a"/>
      <path d="M9 19.5 15 25.5 27 12" fill="none" stroke="#2a2114" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="50" y="27" fill="#f4efe4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">Safe Zone Ready</text>
    <text x="0" y="78" fill="#d7c7a6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28">See the cover before you spend.</text>
    <text x="0" y="124" fill="#8f8370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18">Instagram, TikTok and YouTube Shorts</text>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @safezone-ready/safezone-specs test
      - run: pnpm -r typecheck
      - run: pnpm --filter @safezone-ready/web build
